<svg xmlns="http://www.w3.org/2000/svg" width="88mm" height="116mm" viewBox="0 0 88 116">
  <defs>
    <style><![CDATA[
      .sans { font-family: Arial, Helvetica, 'Liberation Sans', sans-serif; fill:#20272D; }
      .stage { font-size:2.15px; font-weight:700; letter-spacing:0.35px; fill:#536875; }
      .label { font-size:2.55px; font-weight:600; }
      .number { font-size:4.15px; font-weight:700; }
      .secondary { font-size:1.85px; font-weight:400; fill:#5A646C; }
      .annotation { font-size:1.78px; font-weight:400; fill:#5A646C; }
      .callout-head { font-size:2.18px; font-weight:600; }
      .callout-body { font-size:1.72px; font-weight:400; fill:#49535B; }
      .callout-num { font-size:1.72px; font-weight:600; fill:#313940; }
      .mainbox { fill:#FCFDFD; stroke:#77848D; stroke-width:0.23; }
      .firstbox { fill:#F6F8F9; stroke:#6D8290; stroke-width:0.24; }
      .finalbox { fill:#F2F6F8; stroke:#58788A; stroke-width:0.30; }
      .callout { fill:#FBF7F6; stroke:#AA8984; stroke-width:0.20; }
      .flow { fill:none; stroke:#6C7B85; stroke-width:0.22; stroke-linecap:square; }
      .branch { fill:none; stroke:#8C8582; stroke-width:0.20; stroke-linecap:square; }
      .hair { stroke:#9AABB5; stroke-width:0.18; }
    ]]></style>
    <marker id="arrow" markerWidth="3.1" markerHeight="3.1" refX="2.6" refY="1.55" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L3.1,1.55 L0,3.1 Z" fill="#6C7B85"/>
    </marker>
    <marker id="arrowWarm" markerWidth="3.1" markerHeight="3.1" refX="2.6" refY="1.55" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L3.1,1.55 L0,3.1 Z" fill="#8C8582"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="88" height="116" fill="#FFFFFF"/>

  <!-- IDENTIFICATION -->
  <text x="4.8" y="5.7" class="sans stage">IDENTIFICATION</text>
  <line x1="4.8" y1="6.65" x2="57.3" y2="6.65" class="hair"/>
  <rect x="4.8" y="8.0" width="52.5" height="13.5" rx="0.45" class="firstbox"/>
  <text x="7.4" y="13.35" class="sans label">Raw candidate records</text>
  <text x="54.5" y="15.05" text-anchor="end" class="sans number">N = 89</text>
  <text x="7.4" y="18.55" class="sans secondary">OpenAlex 72  |  targeted web search 17</text>

  <!-- 89 to 72 -->
  <line x1="31.05" y1="21.5" x2="31.05" y2="33.65" class="flow" marker-end="url(#arrow)"/>
  <text x="33.25" y="27.05" class="sans annotation">Cross-source duplicates removed</text>
  <text x="33.25" y="29.55" class="sans annotation" style="font-weight:600; fill:#3F4A52;">n = 17</text>

  <!-- SCREENING -->
  <text x="4.8" y="32.1" class="sans stage">SCREENING</text>
  <line x1="4.8" y1="33.0" x2="57.3" y2="33.0" class="hair"/>
  <rect x="4.8" y="34.35" width="52.5" height="13.0" rx="0.45" class="mainbox"/>
  <text x="7.4" y="39.55" class="sans label">Unique records screened</text>
  <text x="54.5" y="41.25" text-anchor="end" class="sans number">N = 72</text>

  <!-- Screening callout -->
  <line x1="57.3" y1="40.85" x2="59.85" y2="40.85" class="branch" marker-end="url(#arrowWarm)"/>
  <rect x="60.3" y="32.95" width="23.0" height="16.8" rx="0.35" class="callout"/>
  <text x="62.0" y="36.20" class="sans callout-head" style="font-size:1.95px;">Screening exclusions</text>
  <text x="62.0" y="38.65" class="sans callout-head" style="font-size:1.72px;">n = 19</text>
  <line x1="62.0" y1="39.70" x2="81.6" y2="39.70" stroke="#D5C4C0" stroke-width="0.16"/>
  <text x="62.0" y="42.35" class="sans callout-body">Non-forecasting</text>
  <text x="81.55" y="42.35" text-anchor="end" class="sans callout-num">9</text>
  <text x="62.0" y="44.75" class="sans callout-body">Maintenance / control</text>
  <text x="81.55" y="44.75" text-anchor="end" class="sans callout-num">9</text>
  <text x="62.0" y="47.15" class="sans callout-body">No explicit physics</text>
  <text x="81.55" y="47.15" text-anchor="end" class="sans callout-num">1</text>

  <!-- 72 to 53 -->
  <line x1="31.05" y1="47.35" x2="31.05" y2="53.15" class="flow" marker-end="url(#arrow)"/>

  <!-- DEDUPLICATION -->
  <text x="4.8" y="51.55" class="sans stage">DEDUPLICATION</text>
  <line x1="4.8" y1="52.45" x2="57.3" y2="52.45" class="hair"/>
  <rect x="4.8" y="53.8" width="52.5" height="12.5" rx="0.45" class="mainbox"/>
  <text x="7.4" y="58.75" class="sans label">Candidate studies</text>
  <text x="54.5" y="60.55" text-anchor="end" class="sans number">N = 53</text>

  <!-- 53 to 48 -->
  <line x1="31.05" y1="66.3" x2="31.05" y2="74.05" class="flow" marker-end="url(#arrow)"/>
  <text x="33.25" y="69.55" class="sans annotation">Preprint / journal pairs consolidated</text>
  <text x="33.25" y="72.05" class="sans annotation" style="font-weight:600; fill:#3F4A52;">n = 5</text>

  <!-- ELIGIBILITY -->
  <text x="4.8" y="72.45" class="sans stage">ELIGIBILITY</text>
  <line x1="4.8" y1="73.35" x2="57.3" y2="73.35" class="hair"/>
  <rect x="4.8" y="74.7" width="52.5" height="13.1" rx="0.45" class="mainbox"/>
  <text x="7.4" y="79.95" class="sans label">Full-text studies assessed</text>
  <text x="54.5" y="81.65" text-anchor="end" class="sans number">N = 48</text>

  <!-- Eligibility callout -->
  <line x1="57.3" y1="81.25" x2="59.85" y2="81.25" class="branch" marker-end="url(#arrowWarm)"/>
  <rect x="60.3" y="71.95" width="23.0" height="19.0" rx="0.35" class="callout"/>
  <text x="62.0" y="75.10" class="sans callout-head" style="font-size:1.95px;">Full-text exclusions</text>
  <text x="62.0" y="77.55" class="sans callout-head" style="font-size:1.72px;">n = 2</text>
  <line x1="62.0" y1="78.55" x2="81.6" y2="78.55" stroke="#D5C4C0" stroke-width="0.16"/>
  <text x="62.0" y="81.05" class="sans callout-body" style="font-size:1.50px;">S26 - wind-speed forecasting</text>
  <text x="62.0" y="83.10" class="sans callout-body" style="font-size:1.46px; fill:#6A5F5C;">only (no power constraint)</text>
  <text x="62.0" y="86.05" class="sans callout-body" style="font-size:1.50px;">S42 - heuristic method</text>
  <text x="62.0" y="88.10" class="sans callout-body" style="font-size:1.46px; fill:#6A5F5C;">(no explicit equation)</text>

  <!-- 48 to 46 -->
  <line x1="31.05" y1="87.8" x2="31.05" y2="96.65" class="flow" marker-end="url(#arrow)"/>

  <!-- INCLUDED -->
  <text x="4.8" y="95.0" class="sans stage">INCLUDED</text>
  <line x1="4.8" y1="95.9" x2="57.3" y2="95.9" class="hair"/>
  <rect x="4.8" y="97.25" width="52.5" height="14.0" rx="0.45" class="finalbox"/>
  <text x="7.4" y="102.15" class="sans label">Final scoping cohort</text>
  <text x="54.5" y="104.15" text-anchor="end" class="sans number">N = 46</text>
  <text x="7.4" y="108.65" class="sans secondary">2023-2026  |  all studies coded across D1-D5</text>
</svg>
