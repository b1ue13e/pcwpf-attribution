<svg xmlns="http://www.w3.org/2000/svg" width="1388" height="610" viewBox="0 0 694 305">
<defs>
  <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth">
    <path d="M0,0 L8,4 L0,8 Z" fill="#111"/>
  </marker>
  <style><![CDATA[
    .serif { font-family: "Times New Roman","Liberation Serif",serif; fill:#111; }
    .sans  { font-family: Arial,"Liberation Sans",sans-serif; fill:#111; }
    .panelTitle { font-size:17px; font-weight:700; }
    .panelSub { font-size:15px; }
    .title { font-size:21px; font-weight:700; }
    .subtitle { font-size:18px; font-style:italic; }
    .math { font-family:"DejaVu Serif",serif; font-size:18px; font-style:italic; }
    .small { font-size:13px; }
    .model { fill:#d9eef8; stroke:#4f8fb3; stroke-width:1.1; }
  ]]></style>
</defs>

<!-- Background and outer frame -->
<rect x="1.5" y="1.5" width="691" height="302" rx="7" fill="#dff7ef" stroke="#085f3d" stroke-width="2"/>
<rect x="5" y="5" width="684" height="295" rx="5" fill="none" stroke="#47ce87" stroke-width="1.6"/>
<line x1="6" y1="59" x2="688" y2="59" stroke="#47ce87" stroke-width="1.6"/>

<!-- D3 badge -->
<rect x="8" y="8" width="76" height="48" rx="2" fill="#e9fbf3" stroke="#20b76f" stroke-width="1.3"/>
<text x="46" y="42" class="serif" text-anchor="middle" font-size="36" font-weight="700">D3</text>

<!-- Main header -->
<text x="101" y="31" class="serif title">Inference Telemetry Requirements</text>
<text x="101" y="53" class="serif subtitle">What external information is required at deployment?</text>

<!-- Three panels -->
<rect x="8" y="62" width="220" height="226" rx="3" fill="#ffffff" stroke="#3ebd7d" stroke-width="1.3"/>
<rect x="232" y="62" width="228" height="226" rx="3" fill="#ffffff" stroke="#3ebd7d" stroke-width="1.3"/>
<rect x="464" y="62" width="222" height="226" rx="3" fill="#ffffff" stroke="#3ebd7d" stroke-width="1.3"/>

<!-- Left panel -->
<text x="118" y="87" class="serif panelTitle" text-anchor="middle">None</text>
<text x="118" y="108" class="serif panelSub" text-anchor="middle">Historical target SCADA</text>

<text x="103" y="155" class="serif math" text-anchor="middle">
  P<tspan baseline-shift="sub" font-size="12">t−L:t</tspan>
</text>

<!-- left chart axes -->
<line x1="61" y1="243" x2="124" y2="243" stroke="#111" stroke-width="1.1" marker-end="url(#arrow)"/>
<line x1="61" y1="243" x2="61" y2="160" stroke="#111" stroke-width="1.1" marker-end="url(#arrow)"/>
<line x1="57" y1="243" x2="62" y2="243" stroke="#111" stroke-width="1"/>
<line x1="57" y1="202" x2="62" y2="202" stroke="#111" stroke-width="1"/>
<line x1="57" y1="160" x2="62" y2="160" stroke="#111" stroke-width="1"/>
<text x="55" y="248" class="serif small" text-anchor="end">0.0</text>
<text x="55" y="207" class="serif small" text-anchor="end">0.5</text>
<text x="55" y="165" class="serif small" text-anchor="end">1.0</text>
<text x="93" y="263" class="serif small" text-anchor="middle">Time</text>
<text x="24" y="206" class="serif small" text-anchor="middle" transform="rotate(-90 24 206)">Power (p.u.)</text>

<!-- left jagged signal -->
<polyline points="63.0,208.1 65.9,211.6 68.9,206.4 71.8,210.0 74.8,215.9 77.7,214.3 80.7,221.3 83.6,220.8 86.6,224.4 89.5,224.5 92.4,225.6 95.4,236.3 98.3,241.3 101.3,240.5 104.2,238.9 107.2,237.5 110.1,238.2 113.1,235.8 116.0,235.3"
          fill="none" stroke="#1478f2" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>

<!-- left arrow + model box -->
<line x1="123" y1="198" x2="135" y2="198" stroke="#111" stroke-width="1.2" marker-end="url(#arrow)"/>
<rect x="137" y="169" width="58" height="54" rx="1" class="model"/>
<text x="166" y="193" class="serif small" text-anchor="middle">forecast</text>
<text x="166" y="210" class="serif small" text-anchor="middle">model</text>
<line x1="195" y1="198" x2="211" y2="198" stroke="#111" stroke-width="1.2" marker-end="url(#arrow)"/>
<text x="219" y="204" class="serif math" text-anchor="middle">ŷ</text>

<!-- Middle panel -->
<text x="346" y="87" class="serif panelTitle" text-anchor="middle">Forecast input</text>
<text x="346" y="108" class="serif panelSub" text-anchor="middle">Future NWP</text>

<g font-family="DejaVu Serif, serif" fill="#111" font-style="italic">
  <text x="262" y="146" font-size="18">NWP</text>
  <text x="306" y="153" font-size="11">t+1:t+H</text>
  <text x="361" y="146" font-size="18" font-style="normal">∈</text>
  <text x="381" y="146" font-size="18" font-style="normal" font-weight="700">R</text>
  <text x="401" y="136" font-size="11">H×d</text>
</g>

<!-- matrix row labels -->
<text x="257" y="177" class="serif" font-size="14" font-style="italic" text-anchor="middle">v</text>
<text x="257" y="195" class="serif" font-size="14" font-style="italic" text-anchor="middle">T</text>
<text x="257" y="213" class="serif" font-size="14" font-style="italic" text-anchor="middle">P</text>
<g fill="#111"><circle cx="257" cy="224" r="1.2"/><circle cx="257" cy="229" r="1.2"/><circle cx="257" cy="234" r="1.2"/></g>

<!-- vector matrix -->
<g stroke="#ffffff" stroke-width="1">
  <rect x="272" y="162" width="18" height="16" fill="#57c7d8"/><rect x="290" y="162" width="18" height="16" fill="#49b6ca"/><rect x="308" y="162" width="18" height="16" fill="#d8df67"/><rect x="326" y="162" width="18" height="16" fill="#a9d46b"/>
  <rect x="272" y="178" width="18" height="16" fill="#56bdca"/><rect x="290" y="178" width="18" height="16" fill="#80d2c2"/><rect x="308" y="178" width="18" height="16" fill="#e6e87a"/><rect x="326" y="178" width="18" height="16" fill="#62b7d1"/>
  <rect x="272" y="194" width="18" height="16" fill="#5ab3c9"/><rect x="290" y="194" width="18" height="16" fill="#d9df67"/><rect x="308" y="194" width="18" height="16" fill="#87cfad"/><rect x="326" y="194" width="18" height="16" fill="#cddf66"/>
  <rect x="272" y="210" width="18" height="16" fill="#53c2d4"/><rect x="290" y="210" width="18" height="16" fill="#93d2ab"/><rect x="308" y="210" width="18" height="16" fill="#dce572"/><rect x="326" y="210" width="18" height="16" fill="#80c6b9"/>
  <rect x="272" y="226" width="18" height="8" fill="#48afc7"/><rect x="290" y="226" width="18" height="8" fill="#55b7cc"/><rect x="308" y="226" width="18" height="8" fill="#5eb3c7"/><rect x="326" y="226" width="18" height="8" fill="#5bc1ce"/>
</g>
<rect x="272" y="162" width="72" height="72" fill="none" stroke="#408da9" stroke-width="1"/>

<!-- H hours bracket -->
<line x1="272" y1="240" x2="344" y2="240" stroke="#111" stroke-width="1"/>
<line x1="272" y1="237" x2="272" y2="243" stroke="#111" stroke-width="1"/>
<line x1="344" y1="237" x2="344" y2="243" stroke="#111" stroke-width="1"/>
<text x="308" y="259" class="serif" font-size="14" font-style="italic" text-anchor="middle">H hours</text>

<!-- middle arrow + model -->
<line x1="346" y1="198" x2="363" y2="198" stroke="#111" stroke-width="1.2" marker-end="url(#arrow)"/>
<rect x="365" y="169" width="60" height="54" rx="1" class="model"/>
<text x="395" y="193" class="serif small" text-anchor="middle">forecast</text>
<text x="395" y="210" class="serif small" text-anchor="middle">model</text>
<line x1="425" y1="198" x2="442" y2="198" stroke="#111" stroke-width="1.2" marker-end="url(#arrow)"/>
<text x="451" y="204" class="serif math" text-anchor="middle">ŷ</text>

<!-- Right panel -->
<text x="575" y="87" class="serif panelTitle" text-anchor="middle">Contemporaneous state</text>
<text x="575" y="106" class="serif panelSub" text-anchor="middle">Synchronized external</text>
<text x="575" y="124" class="serif panelSub" text-anchor="middle">measurements</text>

<g font-family="DejaVu Serif, serif" fill="#111" font-style="italic">
  <text x="503" y="149" font-size="17">s</text><text x="514" y="139" font-size="9">ext</text><text x="514" y="155" font-size="9">t</text>
  <text x="535" y="149" font-size="17" font-style="normal">= [</text>
  <text x="566" y="149" font-size="17">s</text><text x="576" y="155" font-size="9">t</text><text x="576" y="139" font-size="9">(1)</text>
  <text x="599" y="149" font-size="17" font-style="normal">, …,</text>
  <text x="637" y="149" font-size="17">s</text><text x="647" y="155" font-size="9">t</text><text x="647" y="139" font-size="9">(k)</text>
  <text x="665" y="149" font-size="17" font-style="normal">]</text>
</g>

<!-- right state box -->
<rect x="476" y="165" width="85" height="85" rx="2" fill="#f6fbfd" stroke="#4f8fb3" stroke-width="1.1"/>
<text x="518.5" y="183" class="serif small" text-anchor="middle">SCADA states</text>
<text x="518.5" y="201" class="serif small" text-anchor="middle">grid signals</text>
<text x="518.5" y="219" class="serif small" text-anchor="middle">turbine states</text>
<g fill="#111"><circle cx="518.5" cy="232" r="1.2"/><circle cx="518.5" cy="237" r="1.2"/><circle cx="518.5" cy="242" r="1.2"/></g>

<line x1="563" y1="207" x2="584" y2="207" stroke="#111" stroke-width="1.2" marker-end="url(#arrow)"/>
<rect x="587" y="186" width="62" height="52" rx="1" class="model"/>
<text x="618" y="208" class="serif small" text-anchor="middle">forecast</text>
<text x="618" y="225" class="serif small" text-anchor="middle">model</text>
<line x1="649" y1="207" x2="668" y2="207" stroke="#111" stroke-width="1.2" marker-end="url(#arrow)"/>
<text x="677" y="213" class="serif math" text-anchor="middle">ŷ</text>
</svg>
