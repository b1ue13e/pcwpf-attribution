<!DOCTYPE html><html><body style='margin:0;'><?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" width="696" height="373" viewBox="0 0 696 373">
  <defs>

      <stop offset="0" stop-color="#d8efff"/>

  <text class="math" x="405" y="154" font-size="18" font-style="italic">x</text>

  <text class="serif" x="503" y="196" text-anchor="middle" font-size="16">physics / physical prior</text>
