<svg xmlns="http://www.w3.org/2000/svg" width="1398" height="598" viewBox="0 0 699 299">
  <defs>
    <style>
      .serif { font-family: 'Liberation Serif','DejaVu Serif',serif; fill:#111; }
      .title { font-weight:700; }
      .italic { font-style:italic; }
      .small { font-size:13px; }
      .body { font-size:14px; }
      .eq { font-family:'DejaVu Math TeX Gyre','FreeSerif','DejaVu Serif',serif; font-style:italic; fill:#101010; }
      .thin { stroke:#89bcd8; stroke-width:1.25; }
      .section { stroke:#e2a92d; stroke-width:1.15; }
    </style>
    <filter id="soft" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="0.5" stdDeviation="0.7" flood-color="#9a7a1d" flood-opacity="0.18"/>
    </filter>
    <marker id="arrowStart" markerWidth="7" markerHeight="7" refX="1" refY="3.5" orient="auto">
      <path d="M7,0 L0,3.5 L7,7" fill="#111"/>
    </marker>
    <marker id="arrowEnd" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <path d="M0,0 L7,3.5 L0,7" fill="#111"/>
    </marker>
  </defs>

  <!-- page/background -->
  <rect x="1.5" y="1.5" width="696" height="296" rx="9" fill="#fffef8" stroke="#294e62" stroke-width="2"/>
  <rect x="4.5" y="4.5" width="690" height="290" rx="7" fill="none" stroke="#f2bf2d" stroke-width="2.2"/>

  <!-- header -->
  <rect x="8" y="8" width="75" height="47" rx="2" fill="#fffbea" stroke="#e3a82b" stroke-width="1.1"/>
  <line x1="84" y1="8" x2="84" y2="55" stroke="#e3a82b" stroke-width="1.1"/>
  <text x="45.5" y="43" text-anchor="middle" class="serif title" font-size="36">D4</text>
  <text x="100" y="32" class="serif title" font-size="24">Implementation Fidelity</text>
  <text x="102" y="53" class="serif italic" font-size="19.2">Can the published formulation be verified in executable code?</text>
  <line x1="8" y1="59" x2="691" y2="59" stroke="#e3a82b" stroke-width="1.1"/>

  <!-- Code availability label -->
  <text x="19" y="83" class="serif title" font-size="18">Code availability</text>

  <!-- Public panel -->
  <rect x="197" y="64" width="235" height="106" rx="4" fill="#f9fdff" stroke="#86b8d4" stroke-width="1.4"/>
  <text x="314.5" y="81" text-anchor="middle" class="serif title" font-size="17">Public</text>
  <text x="314.5" y="97" text-anchor="middle" class="serif" font-size="13.5">Source code available</text>
  <rect x="210" y="101" width="209" height="63" rx="4" fill="#edf7ff" stroke="#62aee6" stroke-width="1.2"/>

  <!-- public document icon -->
  <path d="M226 110 h25 l8 8 v36 h-33 z" fill="#f9fcff" stroke="#4d7f9c" stroke-width="1.4"/>
  <path d="M251 110 v9 h8" fill="none" stroke="#4d7f9c" stroke-width="1.4"/>
  <line x1="232" y1="123" x2="252" y2="123" stroke="#31556d" stroke-width="1.2"/>
  <line x1="232" y1="131" x2="252" y2="131" stroke="#31556d" stroke-width="1.2"/>
  <line x1="232" y1="139" x2="252" y2="139" stroke="#31556d" stroke-width="1.2"/>
  <line x1="232" y1="147" x2="248" y2="147" stroke="#31556d" stroke-width="1.2"/>
  <text x="271" y="117" class="serif" font-family="monospace" font-size="13.5">loss.py</text>
  <text x="271" y="134" class="serif" font-family="monospace" font-size="13.5">model.py</text>
  <circle cx="276" cy="141.7" r="1.15" fill="#1d4057"/>
  <circle cx="276" cy="147.0" r="1.15" fill="#1d4057"/>
  <circle cx="276" cy="152.3" r="1.15" fill="#1d4057"/>
  <text x="286" y="157" font-family="'Liberation Mono','DejaVu Sans Mono',monospace" font-size="13.5" fill="#1c73dc">return </text>
  <text x="337" y="157" class="eq" font-size="15" fill="#1c73dc">ℒ</text>
  <text x="350" y="161" class="serif italic" font-size="10.5" fill="#1c73dc">phys</text>

  <!-- Not found panel -->
  <rect x="436" y="64" width="245" height="106" rx="4" fill="#fbfdfe" stroke="#86b8d4" stroke-width="1.4"/>
  <text x="558.5" y="81" text-anchor="middle" class="serif title" font-size="17">Not found</text>
  <text x="558.5" y="97" text-anchor="middle" class="serif" font-size="13.5">No accessible source code</text>
  <rect x="448" y="101" width="221" height="63" rx="4" fill="#fff" stroke="#7fb1ce" stroke-width="1.5" stroke-dasharray="6,4"/>

  <!-- dashed document icon -->
  <path d="M482 110 h25 l8 8 v36 h-33 z" fill="none" stroke="#4f8dad" stroke-width="1.45" stroke-dasharray="4,3"/>
  <path d="M507 110 v9 h8" fill="none" stroke="#4f8dad" stroke-width="1.45" stroke-dasharray="4,3"/>
  <line x1="488" y1="124" x2="508" y2="124" stroke="#4f8dad" stroke-width="1.2" stroke-dasharray="4,3"/>
  <line x1="488" y1="132" x2="508" y2="132" stroke="#4f8dad" stroke-width="1.2" stroke-dasharray="4,3"/>
  <line x1="488" y1="140" x2="508" y2="140" stroke="#4f8dad" stroke-width="1.2" stroke-dasharray="4,3"/>
  <line x1="488" y1="148" x2="504" y2="148" stroke="#4f8dad" stroke-width="1.2" stroke-dasharray="4,3"/>
  <text x="548" y="129" class="serif" font-size="15">code:</text>
  <text x="548" y="147" class="serif" font-size="15">not available</text>

  <!-- separator -->
  <line x1="8" y1="176" x2="691" y2="176" stroke="#e3a82b" stroke-width="1.1"/>
  <text x="18" y="193" class="serif title" font-size="17.5">Equation–code parity</text>
  <text x="194" y="193" class="serif italic" font-size="15.5">If code is public, evaluate equation–code parity</text>
  <line x1="8" y1="198" x2="691" y2="198" stroke="#e3a82b" stroke-width="1.1"/>

  <!-- bottom cards -->
  <!-- Card 1: Published equation -->
  <rect x="12" y="205" width="132" height="79" rx="4" fill="#fffdfc" stroke="#eab0b0" stroke-width="1.2"/>
  <text x="78" y="222" text-anchor="middle" class="serif title" font-size="14.5">Published equation</text>
  <rect x="20" y="229" width="116" height="47" rx="4" fill="#ffe8ed" stroke="#ff9aac" stroke-width="1.15"/>
  <g class="eq">
    <text x="44" y="261" font-size="25">ℒ</text>
    <text x="59" y="266" font-size="12">pub</text>
    <text x="80" y="261" font-size="25">(θ)</text>
  </g>

  <!-- bidirectional arrow between card 1 and card 2 -->
  <line x1="148" y1="248" x2="167" y2="248" stroke="#111" stroke-width="1.7" marker-start="url(#arrowStart)" marker-end="url(#arrowEnd)"/>

  <!-- Card 2: Source code -->
  <rect x="171" y="205" width="118" height="79" rx="4" fill="#fffdfc" stroke="#9fbfd3" stroke-width="1.2"/>
  <text x="230" y="222" text-anchor="middle" class="serif title" font-size="14.5">Source code</text>
  <rect x="179" y="229" width="102" height="47" rx="4" fill="#eaf6ff" stroke="#8fc4e2" stroke-width="1.15"/>
  <g class="eq">
    <text x="197" y="261" font-size="25">ℒ</text>
    <text x="212" y="266" font-size="12">exec</text>
    <text x="240" y="261" font-size="25">(θ)</text>
  </g>

  <!-- Card 3: Aligned -->
  <rect x="294" y="205" width="194" height="79" rx="4" fill="#effcf5" stroke="#79c7a5" stroke-width="1.2"/>
  <text x="391" y="221" text-anchor="middle" class="serif title" font-size="15">Aligned</text>
  <text x="391" y="235" text-anchor="middle" class="serif" font-size="12.5">Executable implementation</text>
  <text x="391" y="247" text-anchor="middle" class="serif" font-size="12.5">matches formulation</text>
  <rect x="303" y="251" width="176" height="26" rx="4" fill="#dff8e8"/>
  <g class="eq">
    <text x="320" y="270" font-size="19">ℒ</text>
    <text x="332" y="274" font-size="9.5">pub</text>
    <text x="348" y="270" font-size="19">(θ)</text>
    <text x="377" y="270" font-size="18">=</text>
    <text x="397" y="270" font-size="19">ℒ</text>
    <text x="409" y="274" font-size="9.5">exec</text>
    <text x="432" y="270" font-size="19">(θ)</text>
  </g>

  <!-- Card 4: Mismatch -->
  <rect x="494" y="205" width="193" height="79" rx="4" fill="#fff1f4" stroke="#d4a1af" stroke-width="1.2"/>
  <text x="590.5" y="221" text-anchor="middle" class="serif title" font-size="15">Mismatch</text>
  <text x="590.5" y="235" text-anchor="middle" class="serif" font-size="12.5">Discrepancy between</text>
  <text x="590.5" y="247" text-anchor="middle" class="serif" font-size="12.5">formulation and code</text>
  <rect x="503" y="251" width="175" height="26" rx="4" fill="#f8e4ea"/>
  <g class="eq">
    <text x="520" y="270" font-size="19">ℒ</text>
    <text x="532" y="274" font-size="9.5">pub</text>
    <text x="548" y="270" font-size="19">(θ)</text>
    <text x="577" y="270" font-size="18">≠</text>
    <text x="597" y="270" font-size="19">ℒ</text>
    <text x="609" y="274" font-size="9.5">exec</text>
    <text x="632" y="270" font-size="19">(θ)</text>
  </g>
</svg>
