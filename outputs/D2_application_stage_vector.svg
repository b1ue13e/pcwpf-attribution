<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" width="696" height="373" viewBox="0 0 696 373">
  <defs>
    <linearGradient id="headerGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d8efff"/>
      <stop offset="1" stop-color="#c8e9fb"/>
    </linearGradient>
    <linearGradient id="formulaGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e5f5ff"/>
      <stop offset="1" stop-color="#d7effd"/>
    </linearGradient>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,4 L0,8 Z" fill="#111"/>
    </marker>
    <clipPath id="matrixClip"><rect x="235" y="267" width="86" height="63"/></clipPath>
    <style>
      .serif { font-family: Tinos, 'Times New Roman', 'Liberation Serif', serif; fill:#111; }
      .math { font-family: FreeSerif, 'STIX Two Math', serif; fill:#111; }
      .title { font-weight:700; }
      .panel { fill:#fff; stroke:#3b8ec4; stroke-width:1.35; }
      .blue { stroke:#0878ec; fill:none; }
    </style>
  </defs>

  <!-- outer frame -->
  <rect x="0.8" y="0.8" width="694.4" height="371.4" rx="7.5" fill="#f8fcff" stroke="#0b0b0b" stroke-width="1.6"/>
  <rect x="3.7" y="3.7" width="688.6" height="365.6" rx="6.5" fill="none" stroke="#1595ea" stroke-width="2.1"/>

  <!-- header -->
  <rect x="7" y="7" width="681.5" height="52.5" rx="3" fill="url(#headerGrad)" stroke="#2f8bc2" stroke-width="1.2"/>
  <rect x="12" y="9" width="72" height="47" rx="2.3" fill="#eef8ff" stroke="#1e8ed7" stroke-width="1.2"/>
  <text class="serif title" x="21" y="45" font-size="36">D2</text>
  <line x1="96" y1="11" x2="96" y2="55" stroke="#5a9ec8" stroke-width="1.15"/>
  <text class="serif title" x="105" y="35" font-size="28">Application Stage</text>
  <text class="serif" x="105" y="55" font-size="20" font-style="italic">Where does physics enter the forecasting system?</text>

  <!-- panel 1: training loss -->
  <rect class="panel" x="7" y="65" width="326" height="137" rx="3.2"/>
  <text class="serif title" x="20" y="90" font-size="22">Training loss</text>
  <text class="serif" x="20" y="111" font-size="17">Physics term in objective function</text>
  <rect x="20" y="124" width="302" height="59" rx="4" fill="url(#formulaGrad)"/>
  <text class="math" x="171" y="162" text-anchor="middle" font-size="28" font-style="italic">ℒ = ℒ<tspan dy="5" font-size="18">task</tspan><tspan dy="-5"> + λℒ</tspan><tspan dy="5" font-size="18">phys</tspan></text>

  <!-- panel 2: architecture -->
  <rect class="panel" x="336" y="65" width="352" height="137" rx="3.2"/>
  <text class="serif title" x="351" y="90" font-size="22">Architecture</text>
  <text class="serif" x="351" y="111" font-size="17">Physics-constrained layer / graph</text>
  <text class="serif" x="351" y="150" font-size="16">feature</text>
  <text class="math" x="405" y="151" font-size="18" font-style="italic">x</text>
  <line x1="423" y1="145" x2="448" y2="145" stroke="#111" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="451" y="123" width="103" height="42" fill="#d7edf8" stroke="#2f6f99" stroke-width="1.2"/>
  <text class="serif" x="502.5" y="140" text-anchor="middle" font-size="15">constrained</text>
  <text class="serif" x="502.5" y="156" text-anchor="middle" font-size="15">module</text>
  <line x1="556" y1="145" x2="584" y2="145" stroke="#111" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text class="serif" x="592" y="150" font-size="16">prediction</text>
  <text class="math" x="665" y="151" font-size="18" font-style="italic">ŷ</text>
  <line x1="502.5" y1="181" x2="502.5" y2="167" stroke="#111" stroke-width="1.45" marker-end="url(#arrow)"/>
  <text class="serif" x="502.5" y="196" text-anchor="middle" font-size="14.5">physics / physical prior</text>

  <!-- panel 3: data generation -->
  <rect class="panel" x="7" y="206" width="326" height="153" rx="3.2"/>
  <text class="serif title" x="20" y="230" font-size="22">Data generation</text>
  <text class="serif" x="20" y="246" font-size="13">Physics-guided synthetic samples</text>

  <!-- physical simulator box -->
  <rect x="14" y="266" width="66" height="42" fill="#dff1fb" stroke="#2c739e" stroke-width="1.25"/>
  <text class="math" x="47" y="293" text-anchor="middle" font-size="20" font-style="italic">f<tspan dy="4" font-size="13">phys</tspan><tspan dy="-4" font-size="20">(θ)</tspan></text>
  <text class="serif" x="47" y="321" text-anchor="middle" font-size="13">physical</text>
  <text class="serif" x="47" y="335" text-anchor="middle" font-size="13">simulator</text>

  <!-- arrow 1 -->
  <line x1="86" y1="287" x2="108" y2="287" stroke="#111" stroke-width="1.45" marker-end="url(#arrow)"/>

  <!-- sample set formula -->
  <text class="math" x="114" y="287" font-size="18" font-style="italic">{</text>
  <text class="math" x="122" y="287" font-size="16" font-style="italic">x</text>
  <text class="math" x="131" y="277" font-size="10.5" font-style="italic">(i)</text>
  <text class="math" x="142" y="287" font-size="16" font-style="italic">,</text>
  <text class="math" x="148" y="287" font-size="16" font-style="italic">y</text>
  <text class="math" x="157" y="277" font-size="10.5" font-style="italic">(i)</text>
  <text class="math" x="170" y="287" font-size="18" font-style="italic">}</text>
  <text class="math" x="177" y="276" font-size="10" font-style="italic">N</text>
  <text class="math" x="176" y="296" font-size="9.5" font-style="italic">i=1</text>

  <!-- arrow 2 -->
  <line x1="202" y1="287" x2="228" y2="287" stroke="#111" stroke-width="1.45" marker-end="url(#arrow)"/>

  <!-- matrix tensor -->
  <text class="math" x="278" y="259" text-anchor="middle" font-size="13.5" font-style="italic">X ∈ R<tspan dy="-4" font-size="9.5">N×T×d</tspan></text>
  <rect x="234" y="266" width="88" height="65" fill="#f4fbff" stroke="#2c85ba" stroke-width="1.25"/>
  <g clip-path="url(#matrixClip)">
    <line x1="240" y1="275" x2="316" y2="275" stroke="#8ac7f3" stroke-width="1"/>
    <line x1="240" y1="287" x2="316" y2="287" stroke="#8ac7f3" stroke-width="1"/>
    <line x1="240" y1="299" x2="316" y2="299" stroke="#8ac7f3" stroke-width="1"/>
    <line x1="240" y1="311" x2="316" y2="311" stroke="#8ac7f3" stroke-width="1"/>
    <line x1="240" y1="323" x2="316" y2="323" stroke="#8ac7f3" stroke-width="1"/>
    <path d="M238 280 C246 274,252 282,259 277 S274 284,283 278 S298 284,316 278" stroke="#146dff" stroke-width="1.8" fill="none"/>
    <path d="M238 292 C246 286,253 294,260 289 S274 296,284 290 S299 295,317 290" stroke="#146dff" stroke-width="1.8" fill="none"/>
    <path d="M238 304 C247 298,254 306,262 301 S277 308,285 302 S300 308,317 302" stroke="#146dff" stroke-width="1.8" fill="none"/>
    <path d="M238 316 C247 310,254 319,262 313 S277 321,285 314 S300 320,317 314" stroke="#146dff" stroke-width="1.8" fill="none"/>
  </g>
  <circle cx="278" cy="339" r="1.15" fill="#111"/>
  <circle cx="278" cy="344" r="1.15" fill="#111"/>
  <circle cx="278" cy="349" r="1.15" fill="#111"/>

  <!-- panel 4: post-hoc correction -->
  <rect class="panel" x="336" y="206" width="352" height="153" rx="3.2"/>
  <text class="serif title" x="351" y="230" font-size="22">Post-hoc correction</text>
  <text class="serif" x="351" y="249" font-size="17">Projection / clipping after inference</text>

  <!-- chart axes (height 56px, y from 260 to 316) -->
  <line x1="386" y1="316" x2="517" y2="316" stroke="#111" stroke-width="1.25"/>
  <line x1="386" y1="316" x2="386" y2="260" stroke="#111" stroke-width="1.25"/>
  <line x1="386" y1="316" x2="386" y2="320" stroke="#111" stroke-width="1"/>
  <line x1="412" y1="316" x2="412" y2="320" stroke="#111" stroke-width="1"/>
  <line x1="438" y1="316" x2="438" y2="320" stroke="#111" stroke-width="1"/>
  <line x1="464" y1="316" x2="464" y2="320" stroke="#111" stroke-width="1"/>
  <line x1="490" y1="316" x2="490" y2="320" stroke="#111" stroke-width="1"/>
  <line x1="516" y1="316" x2="516" y2="320" stroke="#111" stroke-width="1"/>
  <line x1="382" y1="316" x2="386" y2="316" stroke="#111" stroke-width="1"/>
  <line x1="382" y1="288" x2="386" y2="288" stroke="#111" stroke-width="1"/>
  <line x1="382" y1="260" x2="386" y2="260" stroke="#111" stroke-width="1"/>
  <text class="serif" x="386" y="331" text-anchor="middle" font-size="12">0</text>
  <text class="serif" x="412" y="331" text-anchor="middle" font-size="12">2</text>
  <text class="serif" x="438" y="331" text-anchor="middle" font-size="12">4</text>
  <text class="serif" x="464" y="331" text-anchor="middle" font-size="12">6</text>
  <text class="serif" x="490" y="331" text-anchor="middle" font-size="12">8</text>
  <text class="serif" x="516" y="331" text-anchor="middle" font-size="12">10</text>
  <text class="serif" x="378" y="320" text-anchor="end" font-size="12">0.7</text>
  <text class="serif" x="378" y="292" text-anchor="end" font-size="12">0.9</text>
  <text class="serif" x="378" y="264" text-anchor="end" font-size="12">1.1</text>
  <text class="serif" x="451" y="345" text-anchor="middle" font-size="14">Time step <tspan font-style="italic">t</tspan></text>
  <g transform="translate(353,288) rotate(-90)"><text class="serif" text-anchor="middle" font-size="13.5">Power (p.u.)</text></g>

  <!-- raw forecast dashed arch (real excursion beyond 1.0) -->
  <polyline points="386.0,309.0 392.5,301.6 399.0,294.3 405.5,287.4 412.0,281.0 418.5,275.3 425.0,270.5 431.5,266.6 438.0,263.7 444.5,262.0 451.0,261.4 457.5,262.0 464.0,263.7 470.5,266.6 477.0,270.5 483.5,275.3 490.0,281.0 496.5,287.4 503.0,294.3 509.5,301.6 516.0,309.0" fill="none" stroke="#8da4b7" stroke-width="2.3" stroke-dasharray="7 5" stroke-linejoin="round" stroke-linecap="round"/>
  <!-- projected bound: flat cut at bound 1.00 (y = 274.0) -->
  <polyline points="386.0,309.0 392.5,301.6 399.0,294.3 405.5,287.4 412.0,281.0 418.5,275.3 425.0,274.0 431.5,274.0 438.0,274.0 444.5,274.0 451.0,274.0 457.5,274.0 464.0,274.0 470.5,274.0 477.0,274.0 483.5,275.3 490.0,281.0 496.5,287.4 503.0,294.3 509.5,301.6 516.0,309.0" fill="none" stroke="#096ef1" stroke-width="3.0" stroke-linejoin="round" stroke-linecap="round"/>

  <!-- legend -->
  <line x1="530" y1="267" x2="562" y2="267" stroke="#8da4b7" stroke-width="2.3" stroke-dasharray="7 5"/>
  <text class="serif" x="570" y="271" font-size="13">raw forecast ŷ<tspan baseline-shift="sub" font-size="10">raw</tspan></text>
  <line x1="530" y1="287" x2="562" y2="287" stroke="#096ef1" stroke-width="3"/>
  <text class="serif" x="570" y="291" font-size="13">physical bound</text>
  <text class="serif" x="570" y="307" font-size="13">projected output ŷ<tspan baseline-shift="sub" font-size="10">proj</tspan></text>
</svg>
